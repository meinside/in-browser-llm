<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>f16 uniform canary probe</title>
    <style>
      body { font-family: ui-monospace, monospace; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
      td, th { border: 1px solid #ccc; padding: 0.3rem 0.5rem; text-align: left; font-size: 0.85rem; }
      table { border-collapse: collapse; width: 100%; }
      .ok { color: #0a7f2e; font-weight: bold; }
      .no { color: #c02020; font-weight: bold; }
      pre { background: #f7f7f7; padding: 0.6rem; white-space: pre-wrap; font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <h1>f16 uniform canary probe</h1>
    <p>
      Finds which WGSL shape Firefox rejects, so the capability canary can mirror it.
      Each variant is compiled and then used to create a compute pipeline.
    </p>
    <div id="out">Running…</div>

    <script type="module">
      const VARIANTS = {
        'A: f16 members in uniform struct': `enable f16;
struct U { vec_size: u32, min: f16, max: f16 };
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var<storage, read_write> o: array<vec4<f16>>;
@compute @workgroup_size(1) fn main() {
  o[0] = clamp(vec4<f16>(0h), vec4<f16>(u.min), vec4<f16>(u.max));
}`,

        'B: f16 uniform, no clamp': `enable f16;
struct U { vec_size: u32, min: f16, max: f16 };
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var<storage, read_write> o: array<f16>;
@compute @workgroup_size(1) fn main() { o[0] = u.min + u.max; }`,

        'C: u32-packed uniform (the ORT native fix)': `enable f16;
struct U { vec_size: u32, min: u32, max: u32 };
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var<storage, read_write> o: array<vec4<f16>>;
@compute @workgroup_size(1) fn main() {
  // unpack2x16float returns vec2<f32>, so convert before building vec4<f16>.
  let lo = f16(unpack2x16float(u.min).x);
  let hi = f16(unpack2x16float(u.max).x);
  o[0] = clamp(vec4<f16>(0h), vec4<f16>(lo), vec4<f16>(hi));
}`,

        'D: f16 storage only, no f16 uniform': `enable f16;
@group(0) @binding(0) var<storage, read_write> o: array<vec4<f16>>;
@compute @workgroup_size(1) fn main() {
  o[0] = clamp(vec4<f16>(1h), vec4<f16>(0h), vec4<f16>(2h));
}`,

        'E: f16 struct padded to 16 bytes': `enable f16;
struct U { vec_size: u32, min: f16, max: f16, pad0: u32, pad1: u32 };
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var<storage, read_write> o: array<vec4<f16>>;
@compute @workgroup_size(1) fn main() {
  o[0] = clamp(vec4<f16>(0h), vec4<f16>(u.min), vec4<f16>(u.max));
}`,
      };

      const out = document.querySelector('#out');

      function esc(s) {
        return String(s).replace(/</g, '&lt;');
      }

      (async () => {
        if (!navigator.gpu) {
          out.innerHTML = '<p class="no">No WebGPU.</p>';
          return;
        }
        const adapter = await navigator.gpu.requestAdapter();
        const hasF16 = adapter.features.has('shader-f16');
        const device = await adapter.requestDevice({
          requiredFeatures: hasF16 ? ['shader-f16'] : [],
        });

        const rows = [];
        for (const [label, code] of Object.entries(VARIANTS)) {
          let compileErr = '';
          let pipelineErr = '';
          try {
            device.pushErrorScope('validation');
            const module = device.createShaderModule({ code });
            const info = await module.getCompilationInfo();
            compileErr = info.messages
              .filter((m) => m.type === 'error')
              .map((m) => m.message)
              .join('; ');
            try {
              await device.createComputePipelineAsync({
                layout: 'auto',
                compute: { module, entryPoint: 'main' },
              });
            } catch (e) {
              pipelineErr = e.message;
            }
            const scoped = await device.popErrorScope();
            if (scoped && !pipelineErr) pipelineErr = scoped.message;
          } catch (e) {
            compileErr = compileErr || e.message;
          }
          const ok = !compileErr && !pipelineErr;
          rows.push(
            `<tr><td>${esc(label)}</td>` +
              `<td>${ok ? '<span class="ok">PASS</span>' : '<span class="no">FAIL</span>'}</td>` +
              `<td><pre>${esc(compileErr || pipelineErr || '—')}</pre></td></tr>`,
          );
        }

        out.innerHTML =
          `<p>shader-f16: <strong>${hasF16}</strong> · UA: ${esc(navigator.userAgent)}</p>` +
          `<table><tr><th>variant</th><th>result</th><th>error</th></tr>${rows.join('')}</table>`;
      })();
    </script>
  </body>
</html>
